- name: costco-login
  env: rfp-liveweb
  url: https://www.costco.com/
  prompt: "Sign in to the existing Costco account at Costco.com using the email address and password configured securely for this run. Open the sign-in form, enter the supplied credentials, and submit. Finish when the site visibly confirms a successful authenticated session, such as the account page or a signed-in account menu. Do not create an account, reset a password, change account settings, or purchase anything. Never include the password in the final response. If credentials are missing or an authentication challenge cannot be completed with configured access, stop and report the task as blocked.Use the browser_snapshot, browser_click, browser_navigate, browser_scroll and browser_screenshot tools to operate the Browserbase-hosted browser. These tools and credential entry share the same remote session. Screenshot input masks appear even for empty fields and do not prove successful entry. Use current stable ID selectors where available. Report tool destination restrictions accurately; they do not mean credentials are missing. Stop after a credential rejection rather than retrying the same credentials. \n\nCredential entry: the configured_credentials tool service has the values for this task. Navigate to the official form, call list_login_fields to get its current page_url and input selectors, then call fill_configured_field for email and password. Never attempt to retrieve or display the stored values. Submit using the normal browser tools.In your final response, state which steps actually succeeded and what you observed, without repeating credentials or the confirmation number."
  rubric:
  - r: The agent reaches the official Costco sign-in flow from Costco.com.
    w: 1
  - r: The configured account email address and password are entered in the correct fields without exposing the password in the final response.
    w: 1
  - r: The sign-in is submitted and the site visibly confirms an authenticated account session; an error or unresolved authentication challenge does not satisfy this criterion.
    w: 1
  - r: The agent accurately reports the login outcome without creating an account, resetting a password, changing account settings, or purchasing anything.
    w: 1
  credential_profile: costco
  use_visual_grading: false
  archives: []
