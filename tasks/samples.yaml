- name: epa-air-quality
  url: https://www.epa.gov/
  prompt: You are on epa.gov. Navigate to and use the EPA's AirNow interactive map service to find the
    air quality data near zip code 35173 for April 19, 2024. Your answer should identify the nearest monitoring
    site, its specific site ID, the primary pollutant reported, and the daily AQI value for that date.
  rubric:
  - r: The agent identifies the nearest monitoring site as Leeds
    w: 20
  - r: 'The agent provides the correct site ID: 010731010'
    w: 20
